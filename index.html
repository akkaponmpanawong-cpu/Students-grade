<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoGrade 2569 - ระบบตรวจสอบผลการเรียน</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #74ebe5 0%, #899fd4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            text-align: center;
        }

        /* หน้าแรก */
        .header {
            background: linear-gradient(to bottom, #8ee3f5, #e0f7fa);
            padding: 25px 20px 15px 20px;
            position: relative;
        }

        .lotus-icon {
            font-size: 50px;
            line-height: 1;
            margin-bottom: 5px;
        }

        .title-green {
            color: #2e7d32;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .title-sub {
            color: #333;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .welcome-box {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            font-size: 14px;
            color: #444;
            line-height: 1.5;
        }

        .form-section {
            padding: 20px;
            background: #f9fbfd;
        }

        .form-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #0288d1;
        }

        .btn-submit {
            width: 100%;
            background: #1976d2;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: #1565c0;
        }

        /* หน้าผลลัพธ์ */
        #result-page {
            display: none;
            padding: 20px;
        }

        .result-title {
            color: #d32f2f;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .result-desc {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
            line-height: 1.5;
        }

        .classroom-img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            margin-bottom: 15px;
        }

        .btn-back {
            background: #757575;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- หน้า 1: กรอกรหัส -->
        <div id="search-page">
            <div class="header">
                <div class="lotus-icon">🪷</div>
                <div class="title-green">DoGrade 2569</div>
                <div class="title-sub">มุกดาหาร</div>
                
                <div class="welcome-box">
                    Welcome Back to School 2568<br>
                    ระบบ DoGrade2567 Online<br>
                    เพื่อการตรวจสอบผลการเรียนและการติดต่องานทะเบียน 24 ชั่วโมง<br>
                    <small>หากมีข้อสงสัยผลการเรียนให้ติดต่อครูผู้สอนประจำวิชา .....</small>
                </div>
            </div>

            <div class="form-section">
                <div class="form-title">
                    🎓 บันทึกรหัสที่ขอ DoGrade
                </div>
                
                <form id="gradeForm">
                    <div class="input-group">
                        <label>รหัสนักเรียน / ผู้ปกครอง:</label>
                        <input type="text" placeholder="XXXXXXX" required>
                    </div>
                    <div class="input-group">
                        <label>วันเกิดนักเรียน:</label>
                        <input type="text" placeholder="วว/ดด/ปปปป" required>
                    </div>
                    <button type="submit" class="btn-submit">ตรวจสอบผลการเรียน</button>
                </form>
            </div>
        </div>

        <!-- หน้า 2: หน้าผลลัพธ์ -->
        <div id="result-page">
            <div class="result-title">⚠️ ไม่พบผลการเรียน!</div>
            <div class="result-desc">เกรดของคุณถูกลบออกจากระบบแล้ว...<br>กรุณาซ้ำชั้นที่ห้องนี้ครับ 😭</div>
            
            <img src="https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1000&auto=format&fit=crop" alt="ห้องเรียนว่างเปล่า" class="classroom-img">

            <button type="button" class="btn-back" onclick="goBack()">กลับหน้าแรก</button>
        </div>
    </div>

    <script>
        document.getElementById('gradeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('search-page').style.display = 'none';
            document.getElementById('result-page').style.display = 'block';
        });

        function goBack() {
            document.getElementById('result-page').style.display = 'none';
            document.getElementById('search-page').style.display = 'block';
        }
    </script>
</body>
</html>
